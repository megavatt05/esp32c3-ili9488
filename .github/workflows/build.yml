name: Build ESP32-C3 UART-only

on:
  push:
    branches: [ uart-only ]
  pull_request:
    branches: [ uart-only ]

jobs:
  build:
    name: Build uart-only (IDF 6.0.3, esp32c3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.3
          target: esp32c3
          path: '.'
          command: "idf.py set-target esp32c3 && idf.py build"
