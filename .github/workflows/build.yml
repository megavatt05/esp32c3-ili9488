name: Build ESP32-C3

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build for esp32c3 (IDF 6.0.3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.3
          target: esp32c3
          path: '.'
          # set-target is needed only on first run; build will use IDF_TARGET from the action
          command: |
            idf.py set-target esp32c3
            idf.py build
